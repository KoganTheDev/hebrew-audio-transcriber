name: CI

# windows-latest, not ubuntu: PyQt5 wheels and the app itself target Windows,
# the launcher is PowerShell, and config._default_model_download_root branches
# on os.name. Testing anywhere else would test a configuration nobody runs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Format (ruff)
        run: ruff format --check src tests tools

      - name: Architecture contract (import-linter)
        # The same rule tests/test_layering.py enforces, checked declaratively.
        # Invoke the console script, not `python -m importlinter.cli`: the
        # module form exits 0 without checking anything.
        #
        # PYTHONPATH=src because import-linter builds its graph by importing
        # from sys.path, and nothing is installed into site-packages any more
        # (see pyproject's [tool.setuptools]). Without it the run prints
        # "Could not find package 'config' in your Python path" and checks
        # nothing - which, like the module form above, is a pass that proves
        # nothing rather than a failure.
        env:
          PYTHONPATH: src
        run: lint-imports

      - name: Types (mypy, blocking where it is clean)
        # core/, config/, the presenters and hardware_detection are at zero and
        # must stay there - this step FAILS the build. They are the parts held
        # to disallow_untyped_defs, and the parts where a type error costs a
        # real transcription run.
        run: mypy -p core -p config -p gui.presenters -m hardware_detection

      - name: Types (mypy, everything, advisory)
        # gui/ still reports 10, nearly all of them PyQt5 shipping no type
        # information rather than defects ("Item 'None' of 'QClipboard | None'
        # has no attribute 'setText'"). Reported so the number is visible and
        # can be driven down, not gated, so the gate above stays meaningful.
        continue-on-error: true
        run: mypy -p config -p core -p gui -m hardware_detection

      - name: Tests
        # QT_QPA_PLATFORM=offscreen: the GUI suite builds real widgets and
        # there is no display on a runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=config --cov=core --cov=gui --cov=hardware_detection --cov-branch --cov-fail-under=83

      - name: Documentation density
        # Reported, never gated - no tool can judge whether a given paragraph
        # is load-bearing. See tools/doc_density.py.
        run: python tools/doc_density.py src --baseline docs/doc-density-baseline.json
