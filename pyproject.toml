[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text-transcriber"
version = "2.0.0"
description = "Professional GUI application for audio transcription"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Development Team", email = "dev@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
]

# The single source of truth for what this project depends on.
# requirements.txt and requirements-dev.txt are thin pointers back here
# (`-e .` and `-e .[dev]`) rather than second copies of these lists - they
# used to duplicate them, and the dev lists had already drifted apart
# (pytest>=7.0 here against pytest>=7.0.0 there) before anyone noticed.
dependencies = [
    "faster-whisper>=0.10.0",
    # Speaker diarization. onnxruntime-based, so it adds no torch dependency
    # and needs no HuggingFace account - see core/diarization.py.
    "sherpa-onnx>=1.10.0",
    "PyQt5>=5.15.0",
    "tqdm>=4.60.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    # Qt widget tests: qtbot owns the QApplication lifecycle, which the suite
    # used to hand-roll with a module-scoped fixture.
    "pytest-qt>=4.2",
    # One tool in place of black + flake8 + isort, and it carries the mccabe
    # complexity gate natively.
    "ruff>=0.6",
    "mypy>=1.0",
    # Enforces the core-must-not-import-the-GUI contract at lint time.
    "import-linter>=2.0",
]

[project.scripts]
speech-to-text = "speech_to_text.main:main"

[project.urls]
Homepage = "https://github.com/example/speech-to-text"
Repository = "https://github.com/example/speech-to-text.git"
Issues = "https://github.com/example/speech-to-text/issues"

[tool.setuptools]
# src-layout (PyPA's current recommendation): the package is not importable
# from the repo root, so an editable install is the only way to import it.
# That makes a broken packaging config fail immediately instead of at the
# point a user installs the wheel.
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# Explicit include, not just an exclude list: with a flat layout, setuptools
# discovers every top-level directory holding an __init__.py, which on a
# working checkout would sweep in tests/ (and tests/eval/) alongside the real
# package. Naming what ships is the narrower statement of the two, and it
# does not quietly start shipping the next top-level package someone adds.
include = ["speech_to_text*"]

# The stylesheet and script inlined into every generated transcript, the
# backdrop images they reference, and the window icon. These are read at
# render time, not imported, so a wheel built without them installs and
# imports cleanly and only fails later, at the point a user renders a
# transcript - producing an unstyled document rather than an error anyone
# could trace back to packaging. That silent-failure mode is why this block
# is load-bearing and why tests/test_packaging.py asserts it.
[tool.setuptools.package-data]
"speech_to_text" = ["assets/*.ico"]
"speech_to_text.core" = [
    "assets/*.css",
    "assets/*.js",
    "assets/css/*.css",
    "assets/js/*.js",
    "assets/vistas/*.webp",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order (replaces isort), D docstring
# conventions (PEP 257), C90 mccabe complexity, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "D", "C90", "UP", "B"]
ignore = [
    # D203/D213 contradict D211/D212; the pairs are mutually exclusive and
    # ruff ships both, so one of each has to go.
    "D203",
    "D213",
    # The codebase documents the non-obvious and deliberately leaves trivial
    # helpers bare, which is the house style - see the documentation standard.
    # Requiring a docstring on every public symbol would push it the other way.
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    # Mood and punctuation pedantry. "Returns the path" vs "Return the path"
    # and a missing full stop change nothing for a reader, and enforcing them
    # across ~500 docstrings would bury the real documentation work in churn.
    "D400", "D401", "D403", "D415", "D417",
]

[tool.ruff.lint.mccabe]
# McCabe's own recommendation, and NIST's Structured Testing default ceiling.
# A function over this either gets split or carries a noqa saying why not.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# core/formatting/__init__.py is a facade: it re-exports ~21 names so callers,
# tests and worker.py did not have to change when the package was split out of
# one module. Those imports are unused *in the file* by design.
"**/__init__.py" = ["F401"]
# Test modules carry their reasoning in module and class docstrings rather than
# on every test function, and the sentence-style test names are the summary.
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# core/ is the part that runs in the worker process with no Qt anywhere near
# it, it is already ~90% annotated, and it is where a type error costs a real
# transcription run. Held to a stricter standard than the GUI.
[[tool.mypy.overrides]]
module = ["speech_to_text.core.*", "speech_to_text.config", "speech_to_text.hardware_detection"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# PyQt5 ships no type information, so most errors under gui/ are the stubs
# failing to model Qt's enums and Optional-returning accessors rather than
# real defects ("type[Qt] has no attribute RightToLeft"). Kept lenient so the
# gate stays meaningful instead of being permanently red.
[[tool.mypy.overrides]]
module = ["speech_to_text.gui.*"]
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["speech_to_text"]

[[tool.importlinter.contracts]]
# The same rule tests/test_layering.py enforces at test time, stated
# declaratively so it also fails at lint time. It exists because PyQt5 and
# faster-whisper/ctranslate2 bundle conflicting copies of MSVCP140.dll on
# Windows, and loading both into one process crashes intermittently - see
# core/__init__.py.
name = "core must not depend on the GUI"
type = "forbidden"
source_modules = ["speech_to_text.core"]
forbidden_modules = ["speech_to_text.gui", "PyQt5"]
