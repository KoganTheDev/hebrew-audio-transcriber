[pytest]
testpaths = tests
# src-layout: the package is not importable from the repo root, so put src on
# sys.path for the test run rather than requiring an editable install first.
pythonpath = src
# pytest-qt guesses its Qt binding, and it prefers PyQt6 - which is installed in
# this environment even though the app itself is PyQt5. Left to guess, pytest-qt's
# `qapp` fixture builds a PyQt6 QApplication inside a PyQt5 process and the
# interpreter aborts outright (no traceback, the run just stops). Pin the binding.
qt_api = pyqt5
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=speech_to_text --cov-report=html --cov-report=term-missing --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
