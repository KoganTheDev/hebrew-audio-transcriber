[pytest]
testpaths = tests
# Nothing is installed into site-packages, so this is the only thing that
# makes config/, core/ and gui/ importable.
pythonpath = src
# pytest-qt guesses its Qt binding, and it prefers PyQt6 - which is installed in
# this environment even though the app itself is PyQt5. Left to guess, pytest-qt's
# `qapp` fixture builds a PyQt6 QApplication inside a PyQt5 process and the
# interpreter aborts outright (no traceback, the run just stops). Pin the binding.
qt_api = pyqt5
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=config --cov=core --cov=gui --cov=hardware_detection --cov-branch --cov-report=html --cov-report=term-missing --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
